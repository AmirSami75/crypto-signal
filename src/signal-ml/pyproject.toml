[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-ml-signal"
version = "0.4.0"
description = "Production gRPC inference engine and leakage-aware crypto ML research toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Crypto ML Signal Project"}]
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
grpc = [
  "grpcio>=1.81,<1.82",
  "grpcio-health-checking>=1.81,<1.82",
  "grpcio-reflection>=1.81,<1.82",
  "protobuf>=6.31.1,<7",
]
dev = [
  "grpcio-tools>=1.81,<1.82",
  "pytest>=8.0,<9",
]
tft = [
  "pytorch-forecasting>=1.6,<1.9",
  "lightning>=2.4,<2.6",
  "pytorch-lightning>=2.3,<2.5",
]

[project.scripts]
crypto-signal = "crypto_signal.cli:main"
crypto-signal-ml-server = "crypto_signal_engine.server:main"
crypto-signal-ml-healthcheck = "crypto_signal_engine.healthcheck:main"

[tool.setuptools.packages.find]
where = ["src"]

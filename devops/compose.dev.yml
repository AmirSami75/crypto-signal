services:
  db:
    env_file:
      - ./env/dev/db.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql

  signal-ml:
    build:
      network: host
      target: development
      args:
        PIP_PROXY: ${PIP_PROXY:-http://127.0.0.1:10808}
    env_file:
      - ./env/dev/ml.env
    command: ["python", "-m", "crypto_signal_engine"]
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - ../src/signal-ml/src:/app/src:ro
      - ../src/signal-ml/artifacts:/app/artifacts:ro
      - ../src/signal-ml/artifacts_5m:/app/artifacts_5m:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_PROXY: http://host.docker.internal:10809
      HTTPS_PROXY: http://host.docker.internal:10809
      ALL_PROXY: http://host.docker.internal:10809
      NO_PROXY: localhost,127.0.0.1,signal-ml,db,host.docker.internal
      ML_MODEL_DIR: /app/artifacts/models
      ML_EXTERNAL_PROXY_URL: http://host.docker.internal:10809
      # Online learning: sample store mount + opt-in flag. The store lives on the artifacts volume so
      # it survives restarts; training is disabled until an operator sets ML_ONLINE_LEARNING=true.
      ML_ONLINE_LEARNING: "true"
      ML_TRADE_SAMPLES_PATH: /app/artifacts/online/trade_samples.jsonl
      ML_TRAINING_CONFIG: /app/config.toml
      ML_ONLINE_TRAINING_MIN_SAMPLES: "50"

  api:
    build:
      network: host
      target: development
    env_file:
      - ./env/dev/api.env
      - ./env/dev/db.env
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DOTNET_CLI_HOME: /tmp/dotnet
      NUGET_PACKAGES: /tmp/nuget
      HTTP_PROXY: http://host.docker.internal:10808
      HTTPS_PROXY: http://host.docker.internal:10808
      ALL_PROXY: http://host.docker.internal:10808
      http_proxy: http://host.docker.internal:10808
      https_proxy: http://host.docker.internal:10808
      all_proxy: http://host.docker.internal:10808
      NO_PROXY: localhost,127.0.0.1,db,signal-ml,host.docker.internal
      no_proxy: localhost,127.0.0.1,db,signal-ml,host.docker.internal
      DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "true"
      # Bybit is a futures demo venue; allow leverage only in the local demo stack.
      Trading__Risk__SpotOnly: "false"
      Trading__Risk__MaxLeverage: "5"
      Trading__Risk__AllowShorting: "true"
      # External exchange traffic must use the host V2Ray tunnel. Internal services remain direct
      # through NO_PROXY above (db and signal-ml must never be sent through the public proxy).
      Exchange__BinanceTestnet__ProxyUrl: http://host.docker.internal:10809
      Exchange__BinanceFuturesTestnet__ProxyUrl: http://host.docker.internal:10809
      Exchange__BinanceMainnet__ProxyUrl: http://host.docker.internal:10809
      Exchange__Bitunix__ProxyUrl: http://host.docker.internal:10809
      Exchange__Bybit__ProxyUrl: http://host.docker.internal:10809
    command: ["dotnet", "watch", "run", "--no-launch-profile", "--urls", "http://0.0.0.0:8080"]
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ../src/backend:/workspace/src/backend
      - api_nuget:/tmp/nuget
      - ../contracts:/workspace/contracts:ro
      # The same recordings the ML engine trains on, so a replayed bot and a trained model see
      # byte-identical candles. Read-only: the API replays this data, it never writes it.
      - ../src/signal-ml/data:/workspace/data/replay:ro

  dashboard:
    build:
      network: host
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../src/frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]

  # Bridges the compose network to the host's v2RayN proxy (which only listens on 127.0.0.1:10808).
  # Runs with host networking so 127.0.0.1 inside the container is the host's loopback (v2RayN),
  # while it listens on the Docker gateway so other containers reach it via host.docker.internal:10809.
  proxy:
    image: alpine:3.20
    network_mode: host
    restart: unless-stopped
    environment:
      HTTP_PROXY: http://127.0.0.1:10808
      HTTPS_PROXY: http://127.0.0.1:10808
    command: >
      sh -c "apk add --no-cache socat &&
             socat TCP-LISTEN:10809,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:10808"

volumes:
  postgres_dev_data:
    name: crypto-signal-postgres-dev-dotnet
  api_nuget:
    name: crypto-signal-api-nuget
  frontend_node_modules:

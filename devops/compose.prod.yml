services:
  db:
    env_file:
      - ./env/prod/db.env
    restart: unless-stopped
    volumes:
      - postgres_prod_data:/var/lib/postgresql

  signal-ml:
    env_file:
      - ./env/prod/ml.env
    restart: unless-stopped

  api:
    env_file:
      - ./env/prod/api.env
      - ./env/prod/db.env
    ports:
      - "127.0.0.1:8000:8080"
    restart: unless-stopped

  dashboard:
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres_prod_data:
    name: crypto-signal-postgres-prod

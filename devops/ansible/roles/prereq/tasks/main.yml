---
# prereq: docker engine + compose plugin + python3 on the target.
- name: Install Docker prerequisites (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == "Debian"

- name: Add Docker APT keyring
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true
  when: ansible_os_family == "Debian"

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ deb_arch | default('amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Install Docker engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Ensure docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

- name: Verify docker compose plugin
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false
  failed_when: compose_version.rc != 0

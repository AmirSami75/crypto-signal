[defaults]
inventory = inventories/dev/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
deprecation_warnings = False
# Vault password is NOT defaulted here: a missing default file breaks even
# `--syntax-check`. Pass it explicitly:
#   --vault-password-file ~/.ansible/vault-pass   (or ANSIBLE_VAULT_PASSWORD_FILE)

[privilege_escalation]
become = False

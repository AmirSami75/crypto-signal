---
# AWS EC2 host (app containers + managed RDS, no local db container).
# Matches the live host behind the `aws-crypto` SSH alias.
all:
  hosts:
    aws-01:
      ansible_host: ec2-3-85-59-30.compute-1.amazonaws.com
      ansible_user: ubuntu
      ansible_ssh_private_key_file: ~/Desktop/automation/maxi-srv.pem
      ansible_python_interpreter: /usr/bin/python3

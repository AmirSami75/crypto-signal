---
# Self-hosted production (app + local Postgres container with named volume).
compose_files:
  - compose.yml
  - compose.prod.yml
env_set: prod
manage_db_container: true
db_volume_name: crypto-signal-postgres-prod

env_api:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  OperatingMode: PAPER
  MlService__Address: http://signal-ml:50051
  MlService__DeadlineSeconds: "10"
  MlService__MaxReceiveMessageMb: "4"
  API_Settings__Db__Type: PostgreSql
env_ml:
  ML_ENVIRONMENT: Production
  OPERATING_MODE: PAPER
  ML_GRPC_HOST: 0.0.0.0
  ML_GRPC_PORT: "50051"
  ML_GRPC_WORKERS: "8"
  ML_LOG_LEVEL: Warning
env_db:
  POSTGRES_DB: crypto_signal
  POSTGRES_USER: crypto_signal
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

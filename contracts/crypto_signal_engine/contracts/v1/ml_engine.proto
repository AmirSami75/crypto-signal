syntax = "proto3";

package crypto_signal.ml.v1;

option csharp_namespace = "CryptoSignal.Contracts.Ml.V1";

import "google/protobuf/timestamp.proto";

// Private, versioned contract between the .NET orchestrator and the Python ML engine.
//
// The engine is an advisor. It answers two questions — "what is the signal for this market at these
// barriers" (GetSignal) and "given this bot's configuration and its open position, what now"
// (EvaluateBotDecision) — and nothing it returns is an instruction to trade. Authorization,
// position sizing, order submission and all durable state belong to the .NET service; see
// docs/ARCHITECTURE.md and docs/LIVE_TRADING_SAFETY.md.
//
// RETIRED, DO NOT REINTRODUCE: `enum Signal { SIGNAL_SELL, SIGNAL_HOLD, SIGNAL_BUY }` and
// `message SignalProbabilities`, along with the `PredictSignal` RPC that carried them. In that
// contract SELL meant "exit to cash", not "open a short". Reusing those names for directional
// trading would silently invert the meaning of a stored decision, so they are gone rather than
// redefined. Directional intent is `TradeDirection`.
//
// PRICES AND PERCENTAGES CROSS THIS BOUNDARY AS DECIMAL STRINGS, never as `double`. The .NET side
// holds money as `decimal` and the audit chain requires that the price the engine computed is the
// same price the database records, byte for byte. Only dimensionless quantities — probabilities,
// ratios, ATR multiples, timings — are floating point.
service MlEngineService {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc GetModelInfo(GetModelInfoRequest) returns (GetModelInfoResponse);

  // One-off signal for a requested market at requested barriers.
  rpc GetSignal(GetSignalRequest) returns (GetSignalResponse);

  // Stateless bot advice. Everything the engine is allowed to know arrives in the request.
  rpc EvaluateBotDecision(EvaluateBotDecisionRequest) returns (EvaluateBotDecisionResponse);
}

// ─────────────────────────────── shared value types ───────────────────────────────

enum TradeDirection {
  TRADE_DIRECTION_UNSPECIFIED = 0;
  TRADE_DIRECTION_LONG = 1;
  TRADE_DIRECTION_SHORT = 2;

  // No position, and no reason to open one. Distinct from UNSPECIFIED, which means "not set".
  TRADE_DIRECTION_FLAT = 3;
}

enum BotAction {
  BOT_ACTION_UNSPECIFIED = 0;

  // Nothing to do: stay flat, or hold the open position with its bracket unchanged.
  BOT_ACTION_HOLD = 1;
  BOT_ACTION_OPEN = 2;
  BOT_ACTION_CLOSE = 3;

  // Keep the position, move take-profit and/or stop-loss to the returned levels.
  BOT_ACTION_ADJUST_BRACKET = 4;
}

message Candle {
  // Wire types changed from double to decimal string; the old numbers stay burned so a stale
  // client cannot silently misread a price.
  reserved 2, 3, 4, 5, 6;

  google.protobuf.Timestamp open_time = 1;
  string open = 7;
  string high = 8;
  string low = 9;
  string close = 10;
  string volume = 11;
}

// What the caller is actually betting. The model is barrier-conditional: these distances are inputs
// to it, not a post-hoc filter on its output, so any take-profit / stop-loss pair gets a
// probability calibrated for that specific pair.
message TradeParameters {
  // Required, > 0. Percent of entry price, e.g. "2.5" means 2.5%.
  string take_profit_percent = 1;

  // Required, > 0. Percent of entry price.
  string stop_loss_percent = 2;

  // When false, a short-side edge is reported in the probabilities but the direction answers FLAT.
  bool allow_short = 3;

  // Candles after which an unresolved position is abandoned. 0 -> engine default.
  uint32 max_holding_periods = 4;

  // Below this calibrated probability the direction answers FLAT. 0 -> engine default.
  double minimum_confidence = 5;
}

message TradeLevels {
  // Last closed candle's close. The orchestrator fills at the next candle's open; the gap between
  // the two is slippage, and is the orchestrator's to model.
  string entry_price = 1;
  string take_profit_price = 2;
  string stop_loss_price = 3;

  // Average true range over the model's window, in price units.
  string atr = 4;

  // Reward divided by risk, from the requested percentages alone. Dimensionless.
  double risk_reward_ratio = 5;

  // The requested barriers expressed in ATR multiples — the form the model actually consumes.
  // A 2% target is a different bet on BTC than on a coin that moves 12% a day; these are not.
  double take_profit_atr = 6;
  double stop_loss_atr = 7;
}

// Probability that each outcome is reached FIRST, for the direction reported alongside it. These
// are the triple-barrier outcomes and they sum to 1.
message BarrierProbabilities {
  double take_profit_first = 1;
  double stop_loss_first = 2;

  // Neither barrier touched inside max_holding_periods.
  double timeout = 3;
}

// An open position, as the orchestrator sees it. The engine holds no position state of its own.
message OpenPosition {
  TradeDirection direction = 1;
  string entry_price = 2;
  string quantity = 3;
  google.protobuf.Timestamp opened_at = 4;

  // The bracket currently working at the venue, if any.
  string take_profit_price = 5;
  string stop_loss_price = 6;

  // Closed candles elapsed since the position opened.
  uint32 bars_held = 7;
}

// ─────────────────────────────── capabilities ───────────────────────────────

message GetCapabilitiesRequest {
  string request_id = 1;
}

message SupportedMarket {
  string symbol = 1;
  string interval = 2;
  string model_id = 3;
  string model_version = 4;

  // True for the pooled cross-symbol model, which answers any market that has no dedicated one.
  bool is_wildcard = 5;
}

message GetCapabilitiesResponse {
  string request_id = 1;
  string service = 2;
  string service_version = 3;
  string protocol_version = 4;
  repeated string capabilities = 5;
  repeated string supported_operations = 6;

  // True when at least one model resolved, wildcard included.
  bool model_ready = 7;
  uint32 minimum_candles = 8;
  uint32 maximum_candles = 9;

  // Markets with a dedicated model, plus the wildcard entry when one is loaded.
  repeated SupportedMarket supported_markets = 10;

  // When true, a market absent from supported_markets is still answerable by the pooled model.
  bool wildcard_model_ready = 11;

  // PAPER | SANDBOX | LIVE, as the engine sees it. Advisory: the orchestrator's own mode governs.
  string operating_mode = 12;
}

// ─────────────────────────────── model info ───────────────────────────────

message GetModelInfoRequest {
  string request_id = 1;

  // Which market to resolve. Empty resolves the wildcard model.
  string symbol = 2;
  string interval = 3;
}

// One point on a model's measured confidence distribution.
message ConfidenceReach {
  double threshold = 1;

  // Share of held-out candles whose confidence was at or above `threshold`, in [0, 1].
  double share = 2;
}

message GetModelInfoResponse {
  // `sell_semantics` described a signal enum that no longer exists.
  reserved 11;

  // `probability_threshold` was the close-to-close pipeline's argmax cut-off. A barrier-conditional
  // model has no single such number — the caller supplies `minimum_confidence` per request — and the
  // useful facts about where its scores actually land are `confidence_ceiling` and `confidence_reach`
  // below. Retired rather than repurposed: a caller still reading field 10 would get a number that no
  // longer means what its name says.
  reserved 10;

  string request_id = 1;
  bool ready = 2;
  string model_id = 3;
  string model_version = 4;
  string project_version = 5;

  // "*" for the pooled model.
  string symbol = 6;
  string interval = 7;
  google.protobuf.Timestamp trained_at = 8;
  uint32 feature_count = 9;

  // True when the request fell through to the pooled cross-symbol model.
  bool is_wildcard = 12;

  // How the model was taught, e.g. "triple-barrier first-touch, adverse-wins tie-break".
  string label_scheme = 13;

  // How raw scores were turned into probabilities, e.g. "isotonic, prefit on a later slice".
  string calibration_method = 14;
  uint32 default_max_holding_periods = 15;

  // Barrier distances the model was trained across, in ATR multiples. Outside this range the
  // engine still answers but flags extrapolation in `warning`.
  double minimum_barrier_atr = 16;
  double maximum_barrier_atr = 17;

  // The highest confidence this model produced on held-out data; 0 when the training run did not
  // measure it. A `minimum_confidence` above this can never be met, so what it filters out is every
  // signal — silence, not safety. Surfaced because an operator who sets an unreachable floor sees
  // exactly what a correctly-working cautious model looks like, and has no other way to tell them apart.
  double confidence_ceiling = 18;

  // What a confidence floor costs in coverage, measured on held-out data and ascending by threshold.
  // Empty when unmeasured.
  repeated ConfidenceReach confidence_reach = 19;
}

// ─────────────────────────────── signal ───────────────────────────────

message GetSignalRequest {
  string request_id = 1;
  string symbol = 2;
  string interval = 3;

  // Closed candles, oldest first, at least GetCapabilities.minimum_candles of them.
  repeated Candle candles = 4;
  TradeParameters parameters = 5;

  // Optional optimistic pin. When set, inference fails if a different model would answer.
  string expected_model_version = 6;
}

message GetSignalResponse {
  string request_id = 1;

  // FLAT when no side clears minimum_confidence, or when only the short side does and
  // allow_short is false.
  TradeDirection direction = 2;
  TradeLevels levels = 3;

  // Calibrated probability that take-profit is reached before stop-loss, for `direction`.
  // This is the number a risk engine may threshold on; it is not a raw model score.
  double confidence = 4;
  BarrierProbabilities probabilities = 5;

  // Probability-weighted return per unit risked, net of nothing — fees and slippage are the
  // orchestrator's to subtract.
  double expected_value = 6;

  // Both sides are always reported, so a caller can see the edge it declined to take.
  double long_confidence = 7;
  double short_confidence = 8;

  string symbol = 9;
  string interval = 10;

  // Open time of the last candle supplied, i.e. the candle the answer is computed from.
  google.protobuf.Timestamp candle_open_time = 11;

  // When the next candle closes. A signal computed from a closed candle is stale after this.
  google.protobuf.Timestamp valid_until = 12;

  string model_id = 13;
  string model_version = 14;
  google.protobuf.Timestamp model_trained_at = 15;
  bool used_wildcard_model = 16;

  // SHA-256 over the exact inputs, so a stored decision can be replayed and checked.
  string input_digest_sha256 = 17;

  // Human-readable reasons, for the dashboard and the audit trail.
  repeated string rationale = 18;

  // Non-fatal caveats: barrier extrapolation, thin warm-up, irregular candle spacing.
  string warning = 19;
  double processing_milliseconds = 20;

  // True when a requested barrier fell outside the ATR span the model was fitted across. A
  // machine-readable duplicate of one clause of `warning`, because a risk engine must be able to gate
  // on extrapolation without matching prose — and because it happens routinely: a percent-denominated
  // request becomes a wide ATR bracket whenever the market is quiet, at which point `expected_value`
  // is an extension of the fitted surface and must not be sized on.
  bool barrier_extrapolated = 21;
}

// ─────────────────────────────── bot decision ───────────────────────────────

message EvaluateBotDecisionRequest {
  string request_id = 1;

  // Correlation only. The engine keeps no per-bot state between calls.
  string bot_id = 2;
  string symbol = 3;
  string interval = 4;
  repeated Candle candles = 5;
  TradeParameters parameters = 6;

  // Absent means flat.
  OpenPosition position = 7;
  string expected_model_version = 8;
}

message EvaluateBotDecisionResponse {
  string request_id = 1;
  BotAction action = 2;

  // Direction to open (OPEN), or the direction being closed (CLOSE). FLAT for HOLD.
  TradeDirection direction = 3;

  // Levels for OPEN and ADJUST_BRACKET. On CLOSE, the bracket that was in force.
  TradeLevels levels = 4;

  double confidence = 5;
  BarrierProbabilities probabilities = 6;
  double expected_value = 7;

  // Why, in one machine-readable token: "no_edge", "confidence_below_minimum",
  // "take_profit_touched", "stop_loss_touched", "max_holding_periods_reached",
  // "direction_reversed", "short_not_allowed", "trailing_stop_advanced".
  string reason_code = 8;
  repeated string rationale = 9;

  string symbol = 10;
  string interval = 11;
  google.protobuf.Timestamp candle_open_time = 12;
  google.protobuf.Timestamp valid_until = 13;

  string model_id = 14;
  string model_version = 15;
  google.protobuf.Timestamp model_trained_at = 16;
  bool used_wildcard_model = 17;
  string input_digest_sha256 = 18;

  string warning = 19;
  double processing_milliseconds = 20;

  // Same meaning as on GetSignalResponse: the bracket asked about sits outside the model's fitted span.
  // Field number matches deliberately, so a shared mapper reads the same number on both messages.
  bool barrier_extrapolated = 21;
}

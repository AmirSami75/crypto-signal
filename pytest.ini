[pytest]
# At the repo root, not in src/signal-ml/pyproject.toml, because pytest looks for its config by walking
# *upward from the arguments* — so `pytest ../../tests/ml-engine` invoked inside src/signal-ml searches
# tests/ and the repo root, finds nothing in the package, and silently runs with no configuration at all.
# A settings file that applies only when someone happens to invoke pytest with no arguments is worse than
# none, because the escalation below reads as a guarantee while never actually being in force.
testpaths = tests/ml-engine

# Redundant while the package is pip-installed editable, and load-bearing on a fresh clone that is not.
pythonpath = src/signal-ml/src

addopts = --strict-markers

filterwarnings =
    # A silent RuntimeWarning from a divide-by-zero in feature code is a NaN reaching the model, and a
    # NaN reaching the model is a prediction nobody can explain. Fail on it instead.
    error::RuntimeWarning
    # joblib sets `.shape` on every array it unpickles, which NumPy 2.5 deprecated — about forty warnings
    # per model round-trip and four thousand across the suite. That volume is not harmless: it buries any
    # warning that *is* about this codebase. Scoped to joblib's own module so the identical deprecation
    # still surfaces if our code starts doing it.
    #
    # Deliberately an ignore rather than an escalation. `model_registry._load` catches `Exception` on
    # purpose, so a warning promoted to an error inside `joblib.load` would be caught there and reported
    # as a corrupt bundle — turning a forward-compatibility notice into a false "not a valid model
    # bundle" verdict, which is a worse outcome than the notice.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle
